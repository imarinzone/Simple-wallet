name: Android Build & Release APK

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published, created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Build Environment & Keystore
        run: |
          # Ensure .env file exists for BuildConfig
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Decode debug keystore if present for consistent APK signing
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

      - name: Build APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Organize Output APKs
        id: apks
        run: |
          mkdir -p release-apks
          # Copy debug APK (pre-signed, directly installable on any Android device)
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/VaultFolio-debug.apk
          fi
          # Copy release APK
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-apks/ \; 2>/dev/null || true
          echo "Generated APK files:"
          ls -la release-apks/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultFolio-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Release v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
