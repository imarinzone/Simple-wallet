name: Android Build & Release APK

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published, created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Build Environment & Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          # Ensure .env file exists for BuildConfig
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Optional custom upload keystore from GitHub Secrets (if configured)
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
          fi

          # Decode persistent repository keystore (strip any CRLF/whitespace so base64 never fails)
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

          # Verify decoded keystore integrity; only generate fallback if no valid keystore exists
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Warning: debug.keystore missing or invalid, generating fallback keystore"
            rm -f debug.keystore
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Calculate Release Version and Code
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          MIN_CODE=$(( 1010000 + RUN_NUM ))

          if [ "${{ github.event_name }}" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
            V_NAME="${RAW_TAG#v}"
            V_NAME="${V_NAME#V}"
            IFS='.-_' read -r MAJOR MINOR PATCH _ <<< "$V_NAME"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-1}
            PATCH=${PATCH:-0}
            if [[ "$MAJOR" =~ ^[0-9]+$ ]] && [[ "$MINOR" =~ ^[0-9]+$ ]] && [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              TAG_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH ))
            else
              TAG_CODE=$MIN_CODE
            fi
            if [ "$TAG_CODE" -gt "$MIN_CODE" ]; then
              V_CODE=$TAG_CODE
            else
              V_CODE=$MIN_CODE
            fi
          else
            V_NAME="1.1.${RUN_NUM}"
            V_CODE=$MIN_CODE
          fi

          echo "VERSION_NAME=$V_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$V_CODE" >> $GITHUB_ENV
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "Building version $V_NAME (versionCode: $V_CODE)"

      - name: Build Signed Release APK with Gradle
        env:
          VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify & Organize Signed Release APK
        id: apks
        run: |
          mkdir -p release-apks
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "Error: Signed release APK not found at $RELEASE_APK"
            exit 1
          fi

          # Verify APK signature with Android SDK apksigner if available
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify -v --print-certs "$RELEASE_APK"
          fi

          # Publish only signed release APK so users never mix debug and release builds
          cp "$RELEASE_APK" "release-apks/VaultFolio-release.apk"
          echo "Generated signed release APK in release-apks:"
          ls -lh release-apks/

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultFolio-Release-APK
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: success() && (github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/VaultFolio-release.apk
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', steps.versioning.outputs.version_name) }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Release v{0}', steps.versioning.outputs.version_name) }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
