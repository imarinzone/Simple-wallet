name: Android Build & Release APK

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published, created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Build Environment & Keystore
        run: |
          # Ensure .env file exists for BuildConfig
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Decode debug keystore if base64 file exists
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # If debug.keystore is still missing or empty, generate a valid one with keytool
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Calculate Release Version and Code
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
            V_NAME="${RAW_TAG#v}"
            V_CODE="${{ github.run_number }}"
          else
            V_NAME="1.0.${{ github.run_number }}"
            V_CODE="${{ github.run_number }}"
          fi
          echo "VERSION_NAME=$V_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$V_CODE" >> $GITHUB_ENV
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "Building version $V_NAME (code: $V_CODE)"

      - name: Build APKs with Gradle
        env:
          VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Organize Output APKs
        id: apks
        run: |
          mkdir -p release-apks
          # Copy any built APKs
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-apks/ \;
          # Friendly named APK copies
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/VaultFolio-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/VaultFolio-release.apk
          fi
          echo "Generated APK files in release-apks:"
          ls -la release-apks/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultFolio-APKs
          path: release-apks/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: success() && (github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', steps.versioning.outputs.version_name) }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Release v{0}', steps.versioning.outputs.version_name) }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
